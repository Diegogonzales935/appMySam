<div class="fondo d-flex align-items-center justify-content-center p-3">
  <div class="card shadow-lg tarjeta">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="logo mx-auto mb-2">龍</div>
        <h1 class="h4 fw-bold mb-0">Chifa MY SAM</h1>
        <small class="text-secondary">Gestión de pedidos, órdenes y ventas</small>
      </div>

      <form (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input id="usuario" name="usuario" class="form-control" [(ngModel)]="usuario" autocomplete="username" />
        </div>
        <div class="mb-3">
          <label for="clave" class="form-label">Contraseña</label>
          <input id="clave" name="clave" type="password" class="form-control" [(ngModel)]="clave" autocomplete="current-password" />
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
        }

        <button class="btn btn-mysam w-100" type="submit">
          <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
      </form>

      <details class="mt-4 small text-secondary">
        <summary>Usuarios de prueba</summary>
        <p class="mb-1 mt-2">Contraseña para todos: <code>123</code></p>
        <ul class="mb-0">
          <li><code>mesero</code> / <code>mesero2</code> – Mesero</li>
          <li><code>chef</code> – Chef</li>
          <li><code>cajero</code> – Cajero</li>
          <li><code>admin</code> – Propietario</li>
        </ul>
      </details>
    </div>
  </div>
</div>
