<h1 class="h3 titulo-pagina">Hola, {{ usuario()?.nombre }}</h1>
<p class="text-secondary">Rol: {{ usuario()?.rol }}</p>

<div class="row g-3 mb-4">
  <div class="col-6 col-lg-3">
    <div class="card text-center"><div class="card-body">
      <div class="display-6 fw-bold text-warning">{{ resumen().espera }}</div><small>En espera</small>
    </div></div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card text-center"><div class="card-body">
      <div class="display-6 fw-bold text-primary">{{ resumen().preparacion }}</div><small>En preparación</small>
    </div></div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card text-center"><div class="card-body">
      <div class="display-6 fw-bold text-success">{{ resumen().listas }}</div><small>Listas para entregar</small>
    </div></div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card text-center"><div class="card-body">
      <div class="display-6 fw-bold text-danger">{{ resumen().cuentas }}</div><small>Cuentas abiertas</small>
    </div></div>
  </div>
</div>

<div class="row g-3">
  @for (a of accesos(); track a.ruta) {
    <div class="col-sm-6 col-xl-4">
      <a class="card h-100 text-decoration-none acceso" [routerLink]="a.ruta">
        <div class="card-body d-flex gap-3 align-items-center">
          <i class="bi {{ a.icono }} fs-1"></i>
          <div>
            <h2 class="h5 mb-1">{{ a.titulo }}</h2>
            <p class="mb-0 text-secondary small">{{ a.desc }}</p>
          </div>
        </div>
      </a>
    </div>
  }
</div>
